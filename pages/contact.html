<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Foodie</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="page-shell">
      <section class="page-hero">
        <div class="hero-panel">
          <h1>Contact Foodie</h1>
          <p>Reach out for reservations, catering, or a quick question about your next meal.</p>
        </div>
        <div class="hero-panel">
          <h3>Visit Us</h3>
          <p>123 Flavor Street<br />Open daily from 8am to 10pm</p>
        </div>
      </section>

      <section class="page-grid">
        <article class="contact-card">
          <h3>Send a Message</h3>
          <form>
            <div class="form-group">
              <label for="name">Name</label>
              <input id="name" type="text" placeholder="Your name" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="you@example.com" />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" placeholder="Tell us what you need"></textarea>
            </div>
            <button type="button" class="text-white background-primary p-8 rounded-md">Send Inquiry</button>
          </form>
        </article>
        <article class="contact-card">
          <h3>Get In Touch</h3>
          <p><strong>Phone:</strong> (555) 014-2026</p>
          <p><strong>Email:</strong> hello@foodie.com</p>
          <p><strong>Hours:</strong> Mon–Sun · 8:00 AM to 10:00 PM</p>
        </article>
      </section>
    </main>

    <div id="site-footer"></div>
    <!-- <script src="../scripts/layout.js"></script> -->
    <script src="../scripts/header.js"></script>
    <script src="../scripts/Footer.js"></script>
  </body>
</html>
